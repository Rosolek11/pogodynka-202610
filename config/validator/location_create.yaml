App\Entity\Location:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
              fields: [city]
              message: 'This city already exists.'
              groups: [create]
    properties:
        id:
            - IsNull: { groups: [create] }
        city:
            - NotBlank: { groups: [create] }
            - Length: { min: 2, max: 255, groups: [create] }
        latitude:
            - NotBlank: { groups: [create] }
            - Range: { min: -90, max: 90, groups: [create] }
        longitude:
            - NotBlank: { groups: [create] }
            - Range: { min: -180, max: 180, groups: [create] }
